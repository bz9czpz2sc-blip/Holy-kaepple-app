name: Update VfB News

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update VfB news
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          url = "https://www.vfb.de/templates/generated/1/raw/de.xml"

          req = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              data = response.read()

          root = ET.fromstring(data)

          items = []

          for item in root.findall(".//item")[:10]:
              title = item.findtext("title", "").strip()
              link = item.findtext("link", "").strip()
              description = item.findtext("description", "").strip()
              pub_date = item.findtext("pubDate", "").strip()

              if title and link:
                  items.append({
                      "title": title,
                      "link": link,
                      "description": description,
                      "date": pub_date
                  })

          with open("vfb-news.json", "w", encoding="utf-8") as f:
              json.dump(items, f, ensure_ascii=False, indent=2)

          print(f"{len(items)} VfB-News gespeichert.")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add vfb-news.json

          git diff --cached --quiet || git commit -m "Update VfB news"

          git push
