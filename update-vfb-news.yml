name: Update VfB News
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official VfB RSS
        run: |
          python - <<'PY'
          import json, urllib.request, xml.etree.ElementTree as ET
          url='https://www.vfb.de/templates/generated/1/raw/de.xml'
          data=urllib.request.urlopen(url, timeout=20).read()
          root=ET.fromstring(data)
          out=[]
          for item in root.findall('.//item')[:10]:
              def text(tag):
                  e=item.find(tag)
                  return (e.text or '').strip() if e is not None else ''
              out.append({'date':text('pubDate'),'title':text('title'),'summary':text('description'),'url':text('link')})
          open('vfb-news.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vfb-news.json
          git diff --cached --quiet || git commit -m "Update VfB news"
          git push
