name: Update VfB News

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official VfB RSS feed
        env:
          RSS_URL: https://www.vfb.de/templates/generated/1/raw/de.xml
        run: |
          python3 - <<'PY'
          import urllib.request, xml.etree.ElementTree as ET, json, html, re
          url="https://www.vfb.de/templates/generated/1/raw/de.xml"
          req=urllib.request.Request(url, headers={"User-Agent":"Holy-Kaepple-News/1.0"})
          data=urllib.request.urlopen(req, timeout=20).read()
          root=ET.fromstring(data)
          out=[]
          for item in root.findall(".//item")[:10]:
              title=(item.findtext("title") or "").strip()
              link=(item.findtext("link") or "").strip()
              pub=(item.findtext("pubDate") or "").strip()
              desc=re.sub("<[^>]+>"," ",item.findtext("description") or "")
              desc=html.unescape(" ".join(desc.split()))
              # Convert common RSS date to YYYY-MM-DD where possible.
              from email.utils import parsedate_to_datetime
              try: date=parsedate_to_datetime(pub).date().isoformat()
              except Exception: date=""
              out.append({"title":title,"url":link,"date":date,"summary":desc[:150]})
          with open("vfb-news.json","w",encoding="utf-8") as f:
              json.dump(out,f,ensure_ascii=False,indent=2)
          PY
      - name: Commit updated news
        run: |
          git config user.name "Holy Käpple Bot"
          git config user.email "actions@users.noreply.github.com"
          git add vfb-news.json
          git diff --cached --quiet || git commit -m "Update VfB news"
          git push
